version: '3.9'
services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    restart: always
    volumes:
      - ./:/app
    command: uvicorn src.app:app --reload --host=0.0.0.0 --port=8000
    ports:
      - "8009:8000"
    environment:
      - SYNC_DB_BACKEND=sqlite
      - SYNC_SQLITE_PATH=/app/data/sync.db
  rethinkdb:
    image: rethinkdb:latest
    profiles: ["rethinkdb"]
    ports:
      - "8084:8080"
      - "29015:29015"
      - "28015:28015"
    volumes:
      - ./data:/data
    command: rethinkdb --bind all
